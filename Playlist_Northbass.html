<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist NorthBass</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      background-color: transparent;
    }
    .video-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .video-item {
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }
    .video-item a {
      display: flex;
      gap: 15px;
      text-decoration: none;
      color: #333;
    }
    .video-item img {
      width: 140px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .video-info h3 {
      margin: 0 0 5px 0;
      font-size: 0.95em;
      line-height: 1.3;
    }
    .video-info p {
      margin: 0;
      font-size: 0.8em;
      color: #666;
    }
    .video-item a:hover h3 {
      color: #e52d27;
    }
  </style>
</head>
<body>

  <div id="rss-container">Chargement des vidéos...</div>

  <script>
    async function loadRSS() {
      // ⚠️ Pensez à vérifier votre ID de playlist :
      const playlistId = "PL--_WrWh7bil_mV0Rg4cDKbPDtPWYCcIx"; 
      
      const rssUrl = `https://www.youtube.com/feeds/videos.xml?playlist_id=${playlistId}`;
      const corsProxy = "https://corsproxy.io/?";

      try {
        const response = await fetch(corsProxy + encodeURIComponent(rssUrl));
        const xmlText = await response.text();

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");

        // Récupération des entrées vidéo dans le flux Atom
        const entries = xmlDoc.querySelectorAll("entry");
        const container = document.getElementById('rss-container');

        if (entries.length === 0) {
          container.innerText = "Aucune vidéo trouvée dans la playlist.";
          return;
        }

        let htmlContent = '<ul class="video-list">';

        entries.forEach(entry => {
          const title = entry.querySelector("title")?.textContent || "";
          const link = entry.querySelector("link")?.getAttribute("href") || "#";
          
          // Récupération de la miniature (media:thumbnail)
          const thumbnail = entry.getElementsByTagNameNS("http://search.yahoo.com/mrss/", "thumbnail")[0]?.getAttribute("url") || "";
          
          // Récupération de la description (media:description)
          let description = entry.getElementsByTagNameNS("http://search.yahoo.com/mrss/", "description")[0]?.textContent || "";
          if (description.length > 120) {
            description = description.substring(0, 120) + "...";
          }

          htmlContent += `
            <li class="video-item">
              <a href="${link}" target="_blank">
                <img src="${thumbnail}" alt="${title}" />
                <div class="video-info">
                  <h3>${title}</h3>
                  <p>${description}</p>
                </div>
              </a>
            </li>
          `;
        });

        htmlContent += '</ul>';
        container.innerHTML = htmlContent;

      } catch (error) {
        console.error("Erreur :", error);
        document.getElementById('rss-container').innerText = "Erreur de chargement du flux.";
      }
    }

    loadRSS();
  </script>

</body>
</html>
