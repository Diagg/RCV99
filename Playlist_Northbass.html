<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecteur de Playlist YouTube</title>
  <style>
    /* --- Styles Généraux --- */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 10px;
      background-color: #0D0D0D;
      box-sizing: border-box;
    }

    /* --- Personnalisation de l'ascenseur --- */

    /* 1. Norme Standard (Firefox, Safari récent, Chrome) */
    * {
      scrollbar-width: thin;
      scrollbar-color: #0D0D0D #f2e291; /* [Couleur de la poignée] [Couleur du fond] */
    }
    
    /* 2. Navigateurs WebKit (Chrome, Edge, Safari) */
    ::-webkit-scrollbar {
      width: 8px; /* Largeur de la barre */
    }
    
    ::-webkit-scrollbar-track {
      background: #f2e291; /* Fond jaune clair */
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb {
      background-color: #0D0D0D; /* Poignée sombre pour faire du contraste */
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background-color: #e52d27; /* Devient rouge au survol */
    }
   

    /* --- Alignement des deux panneaux --- */
    .main-wrapper {
      display: flex;
      gap: 10px;
      width: 700px; /* Largeur totale fixée à 600 pixels */
      margin: 0 auto;
      align-items: flex-start;
      box-sizing: border-box;
    }

    /* Panneau de Gauche (Lecteur) - 2/3 de l'écran */
    #player-container {
      flex: 2;
      background-color: #ffed00;
      padding: 8px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      box-sizing: border-box;
    }

    /* Panneau de Droite (Liste) - 1/3 de l'écran */
    #playlist-container {
      flex: 1;
      background-color: #ffed00;
      padding: 6px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      box-sizing: border-box;
      overflow-y: auto; 

      /* Bordures ajoutées en haut et en bas de la liste */
      border-top: 2px solid #0D0D0D;
      border-bottom: 2px solid #0D0D0D;
    }

    /* --- Styles du Lecteur (Gauche) --- */
    .video-responsive {
      position: relative;
      padding-bottom: 56.25%; /* Ratio 16:9 */
      height: 0;
      overflow: hidden;
      margin-bottom: 8px;
      background-color: #000;
      border-radius: 4px;
    }
    
    .video-responsive iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #video-title {
      margin: 0 0 6px 0;
      font-size: 0.85em;
      color: #111;
    }

    #video-description {
      color: #333;
      font-size: 0.65em;
      line-height: 1.35;
      white-space: pre-wrap;
      
      /* Limite visuelle à ~5 lignes */
      max-height: 6.5em;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* --- Styles de la Liste (Droite) --- */
    .video-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .video-item {
      margin-bottom: 6px;
      background-color: #f2cb05;
      border-radius: 4px;
      overflow: hidden;
      transition: background-color 0.2s, border-color 0.2s;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .video-item:hover {
      background-color: #f2e291;
    }
    
    /* Élément actuellement joué */
    .video-item.active {
      border-color: #e52d27;
      background-color: #f2f2f2;
    }

    .video-link {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: #333;
    }

    .video-item img {
      width: 100%;
      height: auto;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
    }

    .video-item h3 {
      margin: 0;
      padding: 4px 6px;
      font-size: 0.6em;
      line-height: 1.25;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* --- Responsive Mobile --- */
    @media (max-width: 620px) {
      .main-wrapper {
        width: 100%;
        flex-direction: column;
      }
      #player-container, #playlist-container {
        width: 100%;
        height: auto !important;
      }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <!-- PANNEAU GAUCHE : Zone du Lecteur Vidéo -->
    <div id="player-container">
      <div id="player-content">Chargement de la vidéo...</div>
    </div>

    <!-- PANNEAU DROIT : Liste des vignettes -->
    <div id="playlist-container">
      <div id="rss-container">Chargement de la liste...</div>
    </div>
  </div>

  <script>
    let videoData = [];

    async function loadRSS() {
      const playlistId = "PL--_WrWh7bil_mV0Rg4cDKbPDtPWYCcIx"; 
      
      const rssUrl = `https://www.youtube.com/feeds/videos.xml?playlist_id=${playlistId}`;
      const corsProxy = "https://corsproxy.io/?";

      try {
        const response = await fetch(corsProxy + encodeURIComponent(rssUrl));
        const xmlText = await response.text();

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");

        const entries = xmlDoc.querySelectorAll("entry");
        const container = document.getElementById('rss-container');

        if (entries.length === 0) {
          container.innerText = "Aucune vidéo trouvée.";
          return;
        }

        let htmlContent = '<ul class="video-list">';

        entries.forEach((entry, index) => {
          const videoId = entry.querySelector("id")?.textContent.split(':').pop() || "";
          const title = entry.querySelector("title")?.textContent || "";
          
          const mediaNs = "http://search.yahoo.com/mrss/";
          const thumbnail = entry.getElementsByTagNameNS(mediaNs, "thumbnail")[0]?.getAttribute("url") || "";
          const description = entry.getElementsByTagNameNS(mediaNs, "description")[0]?.textContent || "";

          videoData[index] = { videoId, title, description };

          htmlContent += `
            <li class="video-item" id="item-${index}" onclick="selectVideo(${index}, true)">
              <div class="video-link">
                <img src="${thumbnail}" alt="${title}" loading="lazy" />
                <h3>${title}</h3>
              </div>
            </li>
          `;
        });

        htmlContent += '</ul>';
        container.innerHTML = htmlContent;

        // Charger la première vidéo (sans lecture automatique)
        selectVideo(0, false);

      } catch (error) {
        console.error("Erreur :", error);
        document.getElementById('rss-container').innerText = "Erreur de chargement.";
      }
    }

    function selectVideo(index, autoPlay = true) {
      const data = videoData[index];
      const playerZone = document.getElementById('player-content');

      if (!data) return;

      const playParam = autoPlay ? 1 : 0;

      playerZone.innerHTML = `
        <div class="video-responsive">
          <iframe 
            src="https://www.youtube.com/embed/${data.videoId}?autoplay=${playParam}" 
            title="${data.title}"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>
        <h2 id="video-title">${data.title}</h2>
        <div id="video-description">${data.description}</div>
      `;

      document.querySelectorAll('.video-item').forEach(item => {
        item.classList.remove('active');
      });
      const activeItem = document.getElementById(`item-${index}`);
      if (activeItem) {
        activeItem.classList.add('active');
      }

      // Ajuster la hauteur de la liste de droite
      setTimeout(adjustPlaylistHeight, 50);
    }

    function adjustPlaylistHeight() {
      if (window.innerWidth > 620) {
        const playerHeight = document.getElementById('player-container').offsetHeight;
        document.getElementById('playlist-container').style.height = `${playerHeight}px`;
      }
    }

    window.addEventListener('resize', adjustPlaylistHeight);

    loadRSS();
  </script>

</body>
</html>
