<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist Northbass</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      background-color: transparent;
    }
    .video-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .video-item {
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }
    .video-item a {
      display: flex;
      gap: 15px;
      text-decoration: none;
      color: #333;
    }
    .video-item img {
      width: 140px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .video-info h3 {
      margin: 0 0 5px 0;
      font-size: 0.95em;
      line-height: 1.3;
    }
    .video-info p {
      margin: 0;
      font-size: 0.8em;
      color: #666;
    }
    .video-item a:hover h3 {
      color: #e52d27; /* Rouge YouTube au survol */
    }
  </style>
</head>
<body>

  <div id="rss-container">Chargement des vidéos...</div>

  <script>
    async function loadRSS() {
      // ⚠️ N'OUBLIEZ PAS DE CHANGER CET ID :
      const playlistId = "PL--_WrWh7bil_mV0Rg4cDKbPDtPWYCcIx"; 
      
      const rssUrl = `https://www.youtube.com/feeds/videos.xml?playlist_id=${playlistId}`;
      const corsProxy = "https://corsproxy.io/?";

      try {
        const [xmlResponse, xslResponse] = await Promise.all([
          fetch(corsProxy + encodeURIComponent(rssUrl)),
          fetch('youtube_rss.xsl')
        ]);

        const xmlText = await xmlResponse.text();
        const xslText = await xslResponse.text();

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const xslDoc = parser.parseFromString(xslText, "text/xml");

        if (window.XSLTProcessor) {
          const processor = new XSLTProcessor();
          processor.importStylesheet(xslDoc);
          const resultDocument = processor.transformToFragment(xmlDoc, document);

          const container = document.getElementById('rss-container');
          container.innerHTML = '';
          container.appendChild(resultDocument);
        }
      } catch (error) {
        console.error(error);
        document.getElementById('rss-container').innerText = "Erreur de chargement du flux.";
      }
    }

    loadRSS();
  </script>

</body>
</html>
